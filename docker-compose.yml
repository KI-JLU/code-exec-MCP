services:
  mcp-server:
    build:
      context: .
      args:
        DOCKER_GID: ${DOCKER_GID:-985}
    ports:
      - "3001:3001"
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3001
      - MCP_DEBUG=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.tmp:/app/.tmp
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "-Y", "off", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
